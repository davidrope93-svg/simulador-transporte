name: Pruebas del motor
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fisiología, parada y casos
        run: node tests/run.js
      - name: index.html al día con src/
        run: python3 build.py && git diff --exit-code index.html sw.js manifest.webmanifest
